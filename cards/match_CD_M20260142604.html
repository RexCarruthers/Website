<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crows v Bulldogs, 2026 Qualifying &amp; Elimination Finals</title>
<style id="viz-css">
:root {
  color-scheme: light;
  --page: #f0efec;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --grass: #eef3ea;
  --line: #c9d3c2;
  --home: #2a78d6;
  --away: #eb6834;
  --src-1: #1baf7a; --src-2: #4a3aa7; --src-3: #e87ba4; --src-4: #eda100;   /* categorical slots 3-6 (validated) */
  --serif: Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #111110; --surface: #1a1a19; --ink: #f2f1ed; --ink2: #bdbcb6; --muted: #8e8d87;
    --grid: #2c2c2a; --axis: #4a4945; --grass: #1f2a1e; --line: #3c4a39;
    --home: #3987e5; --away: #d95926;
    --src-1: #199e70; --src-2: #9085e9; --src-3: #d55181; --src-4: #c98500;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #111110; --surface: #1a1a19; --ink: #f2f1ed; --ink2: #bdbcb6; --muted: #8e8d87;
  --grid: #2c2c2a; --axis: #4a4945; --grass: #1f2a1e; --line: #3c4a39;
  --home: #3987e5; --away: #d95926;
  --src-1: #199e70; --src-2: #9085e9; --src-3: #d55181; --src-4: #c98500;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); }
.page { max-width: 1240px; margin: 0 auto; padding: 16px; }
.card { background: var(--surface); border-radius: 6px; overflow: hidden; }
#viz { display: block; width: 100%; height: auto; font-family: var(--sans); }

/* ---- svg text ---- */
.t-kicker { font: 600 15px var(--sans); fill: var(--ink); }
.t-head { font: 700 34px var(--sans); fill: var(--ink); letter-spacing: -.3px; }
.t-date { font: 400 15px var(--sans); fill: var(--ink2); }
.t-team { font: italic 400 30px var(--serif); fill: var(--ink); }
.t-score { font: 700 64px var(--sans); fill: var(--ink); letter-spacing: -1.5px; }
.t-pts { font: 400 30px var(--sans); fill: var(--ink2); }
.t-small { font: 400 13px var(--sans); fill: var(--ink2); }
.t-mono { font: 400 11px var(--mono); fill: var(--muted); letter-spacing: .6px; text-transform: uppercase; }
.t-stat { font: 700 26px var(--sans); fill: var(--ink); }
.t-stat-lab { font: 400 13px var(--sans); fill: var(--ink2); }
.t-abbr { font: 700 13px var(--sans); fill: var(--ink2); letter-spacing: .5px; }
.t-sub { font: italic 400 30px var(--serif); fill: var(--ink); }
.t-live { font: 700 20px var(--sans); fill: var(--ink); }
.t-ring { font: 400 11px var(--mono); fill: var(--muted); letter-spacing: .5px; }
.t-q { font: 700 12px var(--sans); fill: var(--muted); letter-spacing: 1px; }
.t-xs { font: 400 11.5px var(--mono); fill: var(--ink2); }
.t-xs.goal { font-weight: 700; fill: var(--ink); }
.t-field { font: 700 12px var(--sans); letter-spacing: .6px; fill: var(--ink2); }
.t-key { font: 700 13px var(--sans); fill: var(--ink); letter-spacing: .4px; }
.t-pname { font: 600 15px var(--sans); fill: var(--ink); }
.t-pval { font: 700 15px var(--mono); fill: var(--ink); }
.t-srcval { font: 400 12px var(--mono); fill: var(--ink2); }
.t-keytxt { font: 400 12px var(--sans); fill: var(--ink2); }

.rule { stroke: var(--ink); stroke-width: 1.5; }
.rule-soft { stroke: var(--grid); stroke-width: 1; }
.home-fill { fill: var(--home); }
.away-fill { fill: var(--away); }
.home-stroke { stroke: var(--home); }
.away-stroke { stroke: var(--away); }

/* ---- ring ---- */
.ring-base { fill: none; stroke: var(--axis); stroke-width: 1.2; }
.ring-guide { fill: none; stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 4; }
.ring-tick { stroke: var(--axis); stroke-width: 1; }
.ring-qline { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.wp-home { fill: var(--home); opacity: .9; }
.wp-away { fill: var(--away); opacity: .9; }
.leader { stroke-width: 1.2; fill: none; }
.hand { stroke: var(--ink); stroke-width: 1.5; }
.hand-dot { fill: var(--ink); }
.hover-line { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 2 2; pointer-events: none; }
.hover-dot { fill: var(--surface); stroke: var(--ink); stroke-width: 2; pointer-events: none; }
.call-mark { fill: var(--ink); stroke: var(--surface); stroke-width: 1.5; }
.call-line { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 2; }
.t-call { font: 700 11px var(--mono); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }

/* ---- field ---- */
.oval { fill: var(--grass); stroke: var(--line); stroke-width: 2; }
.fline { fill: none; stroke: var(--line); stroke-width: 1.5; }
.post { stroke: var(--ink2); stroke-linecap: round; }
.shot { stroke-width: 1.6; cursor: pointer; }
.shot.goal { fill-opacity: .85; }
.shot.behind { fill-opacity: .28; }
.shot.no_score { fill-opacity: .06; stroke-dasharray: 2.5 2; }
.shot-ring { fill: none; stroke-width: 1.3; pointer-events: none; }
.shotmark.hl .shot { fill-opacity: .92; stroke-width: 2.6; }
.shotmark.hl .shot.no_score { fill-opacity: .4; }
.shotmark.hl .shot-ring { stroke-width: 2.2; }
.chain-seg { stroke-width: 2.2; stroke-linecap: round; opacity: .9; pointer-events: none; }
.chain-pt { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.6; pointer-events: none; }
.chain-start { fill: none; stroke-width: 2; pointer-events: none; }
.t-chain { font: 600 12px var(--sans); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; pointer-events: none; }
.t-stat-off { font: 400 15px var(--sans); fill: var(--muted); }
.src-1 { fill: var(--src-1); } .src-2 { fill: var(--src-2); } .src-3 { fill: var(--src-3); } .src-4 { fill: var(--src-4); }
.t-seglab { font: 700 12px var(--sans); pointer-events: none; }
.src-dim .src-seg { opacity: .3; }
.src-dim .src-seg.src-hl { opacity: 1; }
.src-seg.src-hl rect { stroke: var(--ink); stroke-width: 2; }
.shot-halo { fill: var(--surface); pointer-events: none; }
/* dim whole marks (not their parts), so the highlighted mark stays fully opaque */
.dim .shotmark { opacity: .18; }
.dim .shotmark.hl { opacity: 1; }
.pulse { fill: none; stroke-width: 2; pointer-events: none; animation: pulse 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }

/* ---- controls ---- */
.controls { margin-top: 12px; background: var(--surface); border-radius: 6px; padding: 10px 12px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 4px 0; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; border-right: 1px solid var(--axis); }
.seg .btn:last-child { border-right: 0; }
.btn { font: 500 13px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--axis);
       border-radius: 6px; padding: 6px 11px; cursor: pointer; min-height: 32px; }
.btn:hover { background: var(--grid); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); min-width: 92px; }
.btn:focus-visible, input:focus-visible { outline: 2px solid var(--home); outline-offset: 2px; }
.pick { font: 500 13px var(--sans); color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; }
.pick select { font: 500 13px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--axis);
               border-radius: 6px; padding: 5px 8px; min-height: 32px; }
.clock { font: 600 14px var(--mono); color: var(--ink); min-width: 84px; }
#scrub { flex: 1 1 260px; accent-color: var(--ink); min-width: 160px; }
.spacer { flex: 1; }
.hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); }

.tip { position: fixed; z-index: 10; pointer-events: none; max-width: 300px; background: var(--surface); color: var(--ink);
       border: 1px solid var(--axis); border-radius: 6px; padding: 8px 10px; font: 12.5px/1.45 var(--sans);
       box-shadow: 0 4px 18px rgba(0, 0, 0, .12); }
.tip b { font-weight: 650; }
.tip .k { color: var(--ink2); }
.tip .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

/* desktop: stats left, ring right, fitted to the window height above the controls */
.wide .page { max-width: none; padding: 8px 12px; }
.wide #viz { max-height: calc(100vh - var(--ctl-h, 90px)); }
/* one compact row of controls under the graphic */
.wide .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px; }
.wide .controls .row { display: contents; }
.wide .controls .spacer { flex: 0; }
.wide #scrub { flex: 1 1 200px; }
.wide .hint { display: none; }
/* larger text in the wide layout's left column (the canvas is scaled to ~0.8 on a 1080p screen) */
.wide .header .t-kicker, .wide .header .t-date { font-size: 18px; }
.wide .score .t-mono, .wide .panel-l .t-mono, .wide #viz > .t-mono { font-size: 13px; }
.wide .score .t-small { font-size: 17px; }
.wide .table .t-abbr, .wide .panel-r .t-abbr { font-size: 15px; }
.wide .table .t-stat-lab { font-size: 16.5px; }
.wide .table .t-stat { font-size: 29px; }
.wide .panel-l .t-key, .wide .panel-r .t-key { font-size: 16px; }
.wide .panel-l .t-keytxt, .wide .panel-r .t-keytxt { font-size: 14.5px; }
.wide .panel-l .t-pname { font-size: 18px; }
.wide .panel-l .t-pval { font-size: 18px; }
.wide .panel-r .t-srcval { font-size: 14px; }
.wide .panel-r .t-seglab { font-size: 14px; }
/* larger text in the tall (phone) layout: a phone shows the 1240-wide canvas at ~0.3 scale */
.tall .header .t-kicker, .tall .header .t-date { font-size: 20px; }
.tall .score .t-mono { font-size: 16px; }
.tall .score .t-small { font-size: 21px; }
.tall .table .t-abbr { font-size: 18px; }
.tall .table .t-stat-lab { font-size: 19px; }
.tall .table .t-stat { font-size: 30px; }
.tall .ring-block .t-ring { font-size: 15px; }
.tall .ring-block .t-q { font-size: 17px; }
.tall .ring-block .t-xs { font-size: 13.5px; }
.tall .ring-block .t-field { font-size: 18px; }
.tall .ring-block .t-live { font-size: 28px; }
.tall .ring-block .t-call { font-size: 14px; }
.tall .ring-block .t-chain { font-size: 16px; }
.tall .panel-l .t-key, .tall .panel-r .t-key { font-size: 21px; }
.tall .panel-l .t-keytxt, .tall .panel-r .t-keytxt { font-size: 17.5px; }
.tall .panel-l .t-pname { font-size: 24px; }
.tall .panel-l .t-pval { font-size: 23px; }
.tall .panel-l .t-mono { font-size: 16px; }
.tall .panel-r .t-abbr { font-size: 20px; }
.tall .panel-r .t-srcval { font-size: 16px; }
.tall .panel-r .t-seglab { font-size: 18px; }
.tall #viz > .t-mono { font-size: 14px; }

.keydlg { max-width: min(640px, calc(100vw - 32px)); border: 1px solid var(--axis); border-radius: 8px; padding: 16px 20px;
          background: var(--surface); color: var(--ink); box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
.keydlg::backdrop { background: rgba(0, 0, 0, .35); }
.keyhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.keyhead h2 { font: 700 16px var(--sans); margin: 0; }
#keybody p { font: 13.5px/1.5 var(--sans); color: var(--ink2); margin: 8px 0; }
#keybody b { color: var(--ink); font-weight: 650; }
#keybody .k { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

.svg-link { text-decoration: underline; cursor: pointer; }
#keybody a { color: var(--ink); }
.back { margin: 0 0 8px; font: 500 14px var(--sans); }
.back a { color: var(--ink2); text-decoration: none; }
.back a:hover { color: var(--ink); text-decoration: underline; }

.static .controls, .static .tip { display: none !important; }
.static .page { padding: 0; }
.static .card { border-radius: 0; }

@media (max-width: 640px) {
  .page { padding: 8px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
</head>
<body>
<main class="page">
  <nav class="back" id="back" hidden></nav>
  <div class="card" id="card">
    <!-- no <title> child: browsers show it as a native hover tooltip over the whole chart -->
    <svg id="viz" viewBox="0 0 1240 1652" role="img" aria-label="Crows v Bulldogs, 2026 Qualifying &amp; Elimination Finals" aria-describedby="viz-desc">
      <desc id="viz-desc">Win probability of the leading team around the outside of a clock face (one quarter per quadrant), in each team's colour, every shot at goal sized by expected score on the ground in the middle.</desc>
    </svg>
  </div>
  <div class="controls" id="controls" aria-label="Playback">
    <div class="row">
      <button id="play" class="btn primary" aria-label="Play">&#9654; Play</button>
      <div class="seg" id="speeds" role="group" aria-label="Speed"></div>
      <span class="clock" id="clock">FT</span>
      <input id="scrub" type="range" min="0" max="4800" step="1" value="4800" aria-label="Match time">
    </div>
    <div class="row">
      <div class="seg" id="jumps" role="group" aria-label="Jump to"></div>
      <div class="seg" role="group" aria-label="Step between shots">
        <button class="btn" id="prev" title="Previous shot (&larr;)">&larr; shot</button>
        <button class="btn" id="next" title="Next shot (&rarr;)">shot &rarr;</button>
      </div>
      <label class="pick" for="stat">Top 5 by <select id="stat"></select></label>
      <span class="spacer"></span>
      <button class="btn" id="keybtn" aria-haspopup="dialog">Key</button>
      <button class="btn" id="theme" aria-label="Switch to dark mode">Dark</button>
      <div class="seg" role="group" aria-label="Export">
        <button class="btn" id="dl-svg">SVG</button>
        <button class="btn" id="dl-png">PNG</button>
      </div>
    </div>
    <p class="hint">Space play/pause &middot; &larr;/&rarr; step shots &middot; [ ] speed &middot; hover the ring or a shot for detail</p>
  </div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <dialog id="keydlg" class="keydlg" aria-labelledby="keytitle">
    <form method="dialog">
      <div class="keyhead"><h2 id="keytitle">Chart key</h2><button class="btn" aria-label="Close key">Close</button></div>
      <div id="keybody"></div>
    </form>
  </dialog>
</main>
<script>

<script>
/* Radial match graphic: WP ring + xS shot map, with playback.
   Data: <script id="match-data"> written by viz/R/write_match_viz.R.
   Modules: header, ring, shots (ring ticks + field), field, top-5 players,
   xS sources, footer, playback, tooltip, export. Every module exposes
   update(tau) so playback just moves tau. */
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("match-data").textContent);
  const params = new URLSearchParams(location.search);
  const STATIC = params.get("static") === "1";
  if (STATIC) { document.documentElement.classList.add("static"); document.documentElement.dataset.theme = "light"; }
  if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");

  // link back to a site index, when the page is part of one
  if (D.back && !STATIC) {
    const nav = document.getElementById("back");
    const a = document.createElement("a"); a.href = D.back.href; a.textContent = "← " + D.back.label;
    nav.appendChild(a); nav.hidden = false;
  }

  // club colours (viz/R/team_colours.R), scoped exactly like the defaults in match.css
  const TC = D.meta.colours;
  if (TC) {
    const v = (c) => `--home: ${c.home}; --away: ${c.away};`;
    const st = document.createElement("style");
    st.id = "team-colours";
    st.textContent = `:root { ${v(TC.light)} }\n` +
      `@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { ${v(TC.dark)} } }\n` +
      `:root[data-theme="dark"] { ${v(TC.dark)} }`;
    document.head.appendChild(st);
  }

  // ---- data ----------------------------------------------------------------
  const cols = (o) => { const k = Object.keys(o), n = o[k[0]] ? o[k[0]].length : 0;
    return Array.from({ length: n }, (_, i) => Object.fromEntries(k.map((c) => [c, o[c][i]]))); };
  const EV = cols(D.wp).sort((a, b) => a.t - b.t);
  const SHOTS = cols(D.shots).filter((s) => s.t != null).sort((a, b) => a.t - b.t);
  const RUSHED = D.rushed ? cols(D.rushed) : [];
  const M = D.meta, H = M.home, A = M.away;
  const T_END = 4800, Q = 1200;
  SHOTS.forEach((s, k) => { s.k = k; s.abbr = s.side === "home" ? H.abbr : A.abbr; });

  // ---- geometry --------------------------------------------------------------
  // Two layouts share one drawing: "tall" (phones, and the PNG) stacks everything;
  // "wide" (desktop) puts the stats in a left column and the ring on the right.
  // Blocks are drawn once in tall-layout coordinates and moved by group transforms.
  let W = 1240, HGT = 1790;
  const CX = 620, CY = 812;                                    // ring centre within the ring block
  const PANEL_Y = 1352;                                         // top-5 and xS-source panels (tall)
  const S = 4.6;                                               // field px per metre
  const G = D.ground.ref, FA = G.L / 2, FB = G.W / 2;
  // The ring follows the oval: every "radius" r is an ellipse with vertical
  // semi-axis r and horizontal semi-axis r + E, so the gap to the ground is even.
  const E = (FA - FB) * S;
  const R0 = FB * S + 36, DR = 80, RIN = R0, ROUT = R0 + DR;  // WP ring: 50% (inner edge) to 100% (outer)
  const RS0 = ROUT + 18, TICK_PX = 7;                          // shot ticks: length ~ xS
  const ang = (t) => (t / T_END) * 2 * Math.PI;                // clockwise from 12 o'clock
  const polar = (r, a) => [CX + (r + E) * Math.sin(a), CY - r * Math.cos(a)];
  // closed band between two of the ring's ellipses, from angle a0 to a1
  const bandPath = (rIn, rOut, a0, a1) => {
    const n = Math.max(2, Math.ceil(((a1 - a0) / (2 * Math.PI)) * 720)), out = [], inn = [];
    for (let i = 0; i <= n; i++) { const a = a0 + ((a1 - a0) * i) / n; out.push(polar(rOut, a)); inn.push(polar(rIn, a)); }
    return d3.line()(out.concat(inn.reverse())) + "Z";
  };
  const ellipse = (g, r, cls) => g.append("ellipse").attr("class", cls).attr("cx", CX).attr("cy", CY).attr("rx", r + E).attr("ry", r);
  const rWP = (wp) => R0 + Math.abs(wp - 0.5) * 2 * DR;      // leader's WP, either team
  const fx = (s) => CX + (s.side === "home" ? s.x : -s.x) * S;  // home attacks right
  const fy = (s) => CY - (s.side === "home" ? s.y : -s.y) * S;
  const rShot = (xs) => 18 * Math.sqrt(Math.max(xs, 0.05) / 6);
  const sideCls = (side) => (side === "home" ? "home" : "away");

  // ---- formatting --------------------------------------------------------------
  const pct = (p) => (p < 0.01 ? "<1%" : p > 0.99 ? ">99%" : Math.round(p * 100) + "%");
  const clockLab = (t) => {
    if (t >= T_END) return "FT";
    const q = Math.min(4, Math.floor(t / Q) + 1), s = Math.max(0, t - (q - 1) * Q);
    return `Q${q} ${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  };
  const typeLab = { set: "set shot", general: "general play", playon_mark: "play on from mark" };
  const outLab = { goal: "Goal", behind: "Behind", no_score: "No score" };

  // ---- running tallies at tau --------------------------------------------------
  function tally(tau) {
    const z = () => ({ g: 0, b: 0, xs: 0, n: 0, sg: 0, sb: 0 });
    const o = { home: z(), away: z() };
    for (const s of SHOTS) { if (s.t > tau) break;
      const r = o[s.side]; r.n++; r.xs += s.xs;
      if (s.pts === 6) { r.g++; r.sg++; } else if (s.pts === 1) { r.b++; r.sb++; } }
    for (const r of RUSHED) if (r.t <= tau) { if (r.pts === 6) o[r.side].g++; else o[r.side].b++; }
    for (const k of ["home", "away"]) { o[k].pts = 6 * o[k].g + o[k].b; o[k].i50 = 0; }
    if (D.i50) D.i50.t.forEach((t, i) => { if (t <= tau) o[D.i50.side[i]].i50++; });
    return o;
  }
  const EVT = EV.map((e) => e.t);
  const eventAt = (tau) => EV[Math.max(0, d3.bisectRight(EVT, tau) - 1)];

  // ---- svg scaffold --------------------------------------------------------------
  const svg = d3.select("#viz").attr("viewBox", `0 0 ${W} ${HGT}`);
  const bg = svg.append("rect").attr("class", "bg").attr("width", W).attr("height", HGT).style("fill", "var(--surface)");
  const defs = svg.append("defs");
  const gHead = svg.append("g").attr("class", "header");      // title row
  const gScore = svg.append("g").attr("class", "score");
  const gTable = svg.append("g").attr("class", "table");
  const gRule2 = svg.append("g");
  const gRingBlock = svg.append("g").attr("class", "ring-block");
  const gRing = gRingBlock.append("g").attr("class", "ring");
  const gField = gRingBlock.append("g").attr("class", "field");
  const gTicks = gRingBlock.append("g").attr("class", "ticks");
  const gLive = gRingBlock.append("g").attr("class", "live");
  const gHover = gRingBlock.append("g").attr("class", "hover");
  const gPanelL = svg.append("g").attr("class", "panel-l");
  const gPanelR = svg.append("g").attr("class", "panel-r");
  const gFoot = svg.append("g").attr("class", "footer");

  const txt = (g, x, y, cls, s, anchor) => g.append("text").attr("x", x).attr("y", y).attr("class", cls)
    .attr("text-anchor", anchor || "start").text(s);
  // every mention of torp links to its site (in SVG text and in the key pop-up)
  const TORP_URL = "https://peteowen1.github.io/torp/";
  function linkText(sel, str) {
    sel.text(null);
    String(str).split(/(\btorp\b)/).forEach((part) => {
      if (!part) return;
      if (part === "torp") sel.append("a").attr("href", TORP_URL).attr("target", "_blank").attr("rel", "noopener")
        .append("tspan").attr("class", "svg-link").text(part);
      else sel.append("tspan").text(part);
    });
    return sel;
  }
  const linkHtml = (str) => String(str).replace(/\btorp\b/g, `<a href="${TORP_URL}" target="_blank" rel="noopener">torp</a>`);

  // ================================ header ===================================
  const header = (() => {
    txt(gHead, 40, 44, "t-kicker", "Match card");
    const title = txt(gHead, CX, 48, "t-head", `${M.season} ${M.round} \u00b7 ${M.venue}`, "middle");
    const date = txt(gHead, W - 40, 44, "t-date", M.date, "end");
    const rule = gHead.append("line").attr("class", "rule").attr("x1", 40).attr("x2", W - 40).attr("y1", 66).attr("y2", 66);

    txt(gScore, 40, 100, "t-mono", `AFL \u00b7 ${M.round} \u00b7 ${M.season}`);
    const rows = [H, A].map((tm, i) => {
      const y = 152 + i * 70, cls = i ? "away-fill" : "home-fill";
      gScore.append("rect").attr("x", 40).attr("y", y - 26).attr("width", 6).attr("height", 32).attr("rx", 2).attr("class", cls);
      txt(gScore, 58, y, "t-team", tm.name);
      return { gb: txt(gScore, 470, y, "t-pts", "", "end"), pts: txt(gScore, 590, y + 4, "t-score", "", "end") };
    });
    const prior = M.prior_wp;
    txt(gScore, 40, 268, "t-small",
      `Pre-game (bookmakers): ${H.abbr} ${pct(prior)} \u00b7 ${A.abbr} ${pct(1 - prior)}`);

    // stat table: home value | label | away value
    const X_H = 760, X_L = 925, X_A = 1090, Y0 = 100;
    txt(gTable, X_H, Y0, "t-abbr", H.abbr, "middle");
    txt(gTable, X_A, Y0, "t-abbr", A.abbr, "middle");
    const stats = [
      ["xS", "Expected score (xS)", (o) => o.xs.toFixed(1)],
      ["n", "Shots", (o) => o.n],
      ["gb", "Scores from shots", (o) => `${o.sg}.${o.sb}`],
      ["i50", "Inside 50s", (o) => o.i50],
    ];
    const statEls = stats.map(([, lab, f], i) => {
      const y = Y0 + 42 + i * 42;
      if (i) gTable.append("line").attr("class", "rule-soft").attr("x1", 690).attr("x2", 1200).attr("y1", y - 30).attr("y2", y - 30);
      txt(gTable, X_L, y - 6, "t-stat-lab", lab, "middle");
      return { f, h: txt(gTable, X_H, y, "t-stat", "", "middle"), a: txt(gTable, X_A, y, "t-stat", "", "middle") };
    });
    gRule2.append("line").attr("class", "rule").attr("x1", 40).attr("x2", 1200).attr("y1", 290).attr("y2", 290);

    const kicker = gHead.select(".t-kicker");
    return { layout(name, w) {
      if (name === "wide") {   // stacked in the left column
        kicker.attr("y", 30); date.attr("x", 680).attr("y", 30);
        title.attr("x", 40).attr("y", 72).attr("text-anchor", "start");
        rule.attr("x2", 680).attr("y1", 90).attr("y2", 90);
      } else {
        kicker.attr("y", 44); date.attr("x", w - 40).attr("y", 44);
        title.attr("x", w / 2).attr("y", 48).attr("text-anchor", "middle");
        rule.attr("x2", w - 40).attr("y1", 66).attr("y2", 66);
      }
    }, update(tau) {
      const o = tally(tau);
      [["home", 0], ["away", 1]].forEach(([k, i]) => { rows[i].gb.text(`${o[k].g}.${o[k].b}`); rows[i].pts.text(o[k].pts); });
      statEls.forEach((s) => { s.h.text(s.f(o.home)); s.a.text(s.f(o.away)); });
      // inside 50s are counted from ball movement; at full time show the official
      // total beside it where the two differ
      const off = D.i50 && D.i50.official, i50 = statEls[statEls.length - 1];
      if (off && tau >= T_END) [["home", i50.h], ["away", i50.a]].forEach(([k, el]) => {
        if (off[k] != null && off[k] !== o[k].i50) el.append("tspan").attr("class", "t-stat-off").text(` (${off[k]})`);
      });
    } };
  })();

  // ================================= ring ====================================
  const ring = (() => {
    // guides: 75% and 100% faint, 50% baseline
    [0.75, 1].forEach((p) => ellipse(gRing, rWP(p), "ring-guide"));
    // quarter boundaries and 5-minute ticks
    for (let m = 0; m < 80; m += 5) {
      const a = ang(m * 60), qb = m % 20 === 0;
      const [x1, y1] = polar(ROUT + 3, a), [x2, y2] = polar(ROUT + (qb ? 14 : 8), a);
      gRing.append("line").attr("class", "ring-tick").attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2);
      if (qb) {
        const [a1, b1] = polar(RIN - 8, a), [a2, b2] = polar(ROUT, a);
        gRing.append("line").attr("class", "ring-qline").attr("x1", a1).attr("y1", b1).attr("x2", a2).attr("y2", b2);
      }
    }
    ["Q1", "Q2", "Q3", "Q4"].forEach((q, i) => {
      const [x, y] = polar(RIN - 18, ang((i + 0.5) * Q));
      txt(gRing, x, y + 4, "t-q", q, "middle");
    });
    // break labels inside the ring; QT/3QT sit above the goalposts (12 o'clock is the live readout)
    txt(gRing, CX + RIN + E - 6, CY - 58, "t-ring", "QT", "end");
    txt(gRing, CX, CY + RIN - 14, "t-ring", "HALF-TIME", "middle");
    txt(gRing, CX - RIN - E + 6, CY - 58, "t-ring", "3QT", "start");

    // WP as a step function: the band grows outward from 50% in the leading team's colour
    const pts = [];
    EV.forEach((e, i) => { if (i) pts.push({ t: e.t, wp: EV[i - 1].wp }); pts.push({ t: e.t, wp: e.wp }); });
    const area = (rOf) => d3.line()(pts.map((d) => polar(rOf(d), ang(d.t))).concat(pts.slice().reverse().map((d) => polar(R0, ang(d.t))))) + "Z";
    const clipId = "wp-clip";
    const clip = defs.append("clipPath").attr("id", clipId).append("path");
    const gWP = gRing.append("g").attr("clip-path", `url(#${clipId})`);
    gWP.append("path").attr("class", "wp-home").attr("d", area((d) => rWP(Math.max(d.wp, 0.5))));
    gWP.append("path").attr("class", "wp-away").attr("d", area((d) => rWP(Math.min(d.wp, 0.5))));
    ellipse(gRing, R0, "ring-base");

    // guide labels just left of 12 o'clock, with a surface halo
    [[1, "100%"], [0.75, "75%"], [0.5, "50%"]].forEach(([p, s]) =>
      txt(gRing, CX - 6, CY - rWP(p) + 4, "t-ring", s, "end")
        .style("paint-order", "stroke").style("stroke", "var(--surface)").style("stroke-width", 3));

    // decided: first moment the trailing side's chance fell below alpha (p < 0.01),
    // marked across the band and labelled on the inside of the ring
    const dc = D.decided;
    let callMark = null;
    if (dc && dc.decided) {
      const a = ang(dc.t), [x0, y0] = polar(R0, a), [x1, y1] = polar(ROUT + 2, a), [x, y] = polar(R0 - 4, a);
      const sn = Math.sin(a), cs = Math.cos(a), [lx, ly] = polar(R0 - 16, a);
      callMark = gRing.append("g").attr("class", "call").datum(dc).style("cursor", "pointer");
      callMark.append("line").attr("class", "call-line").attr("x1", x0).attr("y1", y0).attr("x2", x1).attr("y2", y1);
      callMark.append("path").attr("class", "call-mark").attr("d", d3.symbol(d3.symbolDiamond, 80)()).attr("transform", `translate(${x},${y})`);
      const tm = dc.side === "home" ? H : A;
      txt(callMark, lx, ly + (cs < -0.3 ? 8 : cs > 0.3 ? 2 : 4), "t-call", `${dc.held ? "" : "✗ "}p<.01`,
        sn > 0.3 ? "end" : sn < -0.3 ? "start" : "middle");
      callMark.append("line").attr("x1", x0).attr("y1", y0).attr("x2", x1).attr("y2", y1).style("stroke", "transparent").style("stroke-width", 14);
    }

    // clock hand
    const hand = gRing.append("g");
    const handLine = hand.append("line").attr("class", "hand");
    const handDot = hand.append("circle").attr("class", "hand-dot").attr("r", 3.5);
    return { callMark, update(tau) {
      clip.attr("d", tau > 0 ? bandPath(R0 - 6, ROUT + 12, 0, ang(Math.min(tau, T_END))) : "M0,0Z");
      const show = tau < T_END && tau > 0;
      hand.attr("display", show ? null : "none");
      if (show) {
        const a = ang(tau), [x1, y1] = polar(R0 - 6, a), [x2, y2] = polar(ROUT + 14, a), [dx, dy] = polar(rWP(eventAt(tau).wp), a);
        handLine.attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2);
        handDot.attr("cx", dx).attr("cy", dy);
      }
      if (callMark) callMark.attr("display", dc.t <= tau ? null : "none");
    } };
  })();

  // ================================ field ====================================
  (() => {
    const g = gField.append("g");
    const P = (x, y) => [CX + x * S, CY - y * S];
    const line = d3.line();
    g.append("ellipse").attr("class", "oval").attr("cx", CX).attr("cy", CY).attr("rx", FA * S).attr("ry", FB * S);
    // 50 m arcs clipped to the oval
    [1, -1].forEach((sd) => {
      const p = [];
      for (let th = 0; th <= 2 * Math.PI; th += Math.PI / 400) {
        const x = sd * FA + 50 * Math.cos(th), y = 50 * Math.sin(th);
        if ((x / FA) ** 2 + (y / FB) ** 2 <= 1 && Math.sign(x) === sd && Math.abs(x) <= FA) p.push([x, y]);
      }
      p.sort((u, v) => u[1] - v[1]);
      g.append("path").attr("class", "fline").attr("d", line(p.map(([x, y]) => P(x, y))));
      // goal square 9 x 6.4 m and posts (goal 6.4 m apart, behind posts 6.4 m further)
      g.append("path").attr("class", "fline").attr("d", line([[sd * FA, -3.2], [sd * (FA - 9), -3.2], [sd * (FA - 9), 3.2], [sd * FA, 3.2]].map(([x, y]) => P(x, y))));
      [[-9.6, 3, 1.5], [-3.2, 5, 2.6], [3.2, 5, 2.6], [9.6, 3, 1.5]].forEach(([y, len, w]) => {
        const [x1, y1] = P(sd * FA, y), [x2, y2] = P(sd * (FA + len), y);
        g.append("line").attr("class", "post").attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2).style("stroke-width", w);
      });
    });
    const [sx, sy] = P(-25, 25);
    g.append("rect").attr("class", "fline").attr("x", sx).attr("y", sy).attr("width", 50 * S).attr("height", 50 * S);
    g.append("circle").attr("class", "fline").attr("cx", CX).attr("cy", CY).attr("r", 5 * S);
    g.append("line").attr("class", "fline").attr("x1", CX).attr("x2", CX).attr("y1", CY - FB * S).attr("y2", CY + FB * S).style("stroke-dasharray", "1 5");

    txt(g, CX - FA * S * 0.3, CY + FB * S - 46, "t-field", `← ${A.nick.toUpperCase()} ATTACK`, "middle").style("fill", "var(--away)");
    txt(g, CX + FA * S * 0.3, CY + FB * S - 46, "t-field", `${H.nick.toUpperCase()} ATTACK →`, "middle").style("fill", "var(--home)");
  })();

  // ================================ shots ====================================
  const shots = (() => {
    const gChain = gField.append("g").attr("class", "chain");
    const gF = gField.append("g").attr("class", "shots-field");
    // bigger shots underneath so small ones stay hoverable
    const order = SHOTS.slice().sort((a, b) => b.xs - a.xs);
    const fg = gF.selectAll("g.shotmark").data(order, (d) => d.k).join("g")
      .attr("class", (d) => `shotmark ${sideCls(d.side)}`).attr("transform", (d) => `translate(${fx(d)},${fy(d)})`);
    fg.append("circle").attr("class", "shot-halo").attr("r", (d) => rShot(d.xs) + 2);
    fg.append("circle").attr("class", (d) => `shot ${d.outcome} ${sideCls(d.side)}-fill ${sideCls(d.side)}-stroke`).attr("r", (d) => rShot(d.xs));
    fg.filter((d) => d.outcome === "goal").append("circle").attr("class", (d) => `shot-ring ${sideCls(d.side)}-stroke`).attr("r", (d) => rShot(d.xs) + 4);
    const pulse = gF.append("circle").attr("class", "pulse").attr("display", "none");

    // ring ticks: length ~ xS, end marker = outcome, label = xS
    const gT = gTicks.append("g");
    const tg = gT.selectAll("g.tick").data(SHOTS, (d) => d.k).join("g").attr("class", (d) => `shotmark ${sideCls(d.side)}`);
    tg.each(function (d) {
      const g = d3.select(this), a = ang(d.t), r1 = RS0 + TICK_PX * d.xs;
      const [x0, y0] = polar(RS0, a), [x1, y1] = polar(r1, a);
      g.append("line").attr("class", `leader ${sideCls(d.side)}-stroke`).attr("x1", x0).attr("y1", y0).attr("x2", x1).attr("y2", y1);
      if (d.outcome === "goal") {
        g.append("circle").attr("cx", x1).attr("cy", y1).attr("r", 4).attr("class", `${sideCls(d.side)}-fill`);
        g.append("circle").attr("cx", x1).attr("cy", y1).attr("r", 7).attr("class", `shot-ring ${sideCls(d.side)}-stroke`);
      } else if (d.outcome === "behind") {
        g.append("circle").attr("cx", x1).attr("cy", y1).attr("r", 3.6).attr("class", `${sideCls(d.side)}-stroke`).style("fill", "var(--surface)").style("stroke-width", 1.6);
      } else {
        g.append("path").attr("d", "M-3,-3L3,3M-3,3L3,-3").attr("transform", `translate(${x1},${y1})`).attr("class", `${sideCls(d.side)}-stroke`).style("stroke-width", 1.6);
      }
      d.tickEnd = [x1, y1]; d.a = a;
      // hit target bigger than the mark
      g.append("line").attr("x1", x0).attr("y1", y0).attr("x2", x1).attr("y2", y1).style("stroke", "transparent").style("stroke-width", 12).style("cursor", "pointer");
    });
    // labels: greedy radial tiers to avoid overlap
    // every tick-end marker is an obstacle too (except the label's own)
    const boxes = SHOTS.map((d) => ({ x: d.tickEnd[0] - 6, y: d.tickEnd[1] - 6, w: 12, h: 12, k: d.k }));
    const hit = (b, k) => boxes.some((o) => o.k !== k && b.x < o.x + o.w && o.x < b.x + b.w && b.y < o.y + o.h && o.y < b.y + b.h);
    tg.each(function (d) {
      const s = d.xs.toFixed(1), w = s.length * 8.4 + 2, h = 14, a = d.a, sn = Math.sin(a), cs = Math.cos(a);
      const anchor = sn > 0.25 ? "start" : sn < -0.25 ? "end" : "middle";
      const r0 = RS0 + TICK_PX * d.xs + 12;
      let box, tier = 0, x, y;
      for (; tier < 6; tier++) {
        [x, y] = polar(r0 + tier * 14, a);
        y += cs < -0.3 ? 9 : cs > 0.3 ? -1 : 4;
        box = { x: anchor === "start" ? x : anchor === "end" ? x - w : x - w / 2, y: y - 10, w, h };
        if (!hit(box, d.k)) break;
      }
      boxes.push({ ...box, k: -1 });
      const g = d3.select(this);
      if (tier > 0) {
        const [lx, ly] = polar(r0 + tier * 14 - 9, a);
        g.append("line").attr("class", "ring-tick").attr("x1", d.tickEnd[0]).attr("y1", d.tickEnd[1]).attr("x2", lx).attr("y2", ly).style("stroke-dasharray", "1 2");
      }
      txt(g, x, y, `t-xs ${d.outcome === "goal" ? "goal" : ""}`, s, anchor);
    });
    // rushed (and other unshot) scores: short tick, small open square
    const rg = gT.selectAll("g.rushed").data(RUSHED).join("g").attr("class", "rushed");
    rg.each(function (d) {
      const a = ang(d.t), [x0, y0] = polar(RS0, a), [x1, y1] = polar(RS0 + 8, a);
      const g = d3.select(this);
      g.append("line").attr("class", `leader ${sideCls(d.side)}-stroke`).attr("x1", x0).attr("y1", y0).attr("x2", x1).attr("y2", y1).style("stroke-dasharray", "2 1.5");
      g.append("rect").attr("x", x1 - 2.5).attr("y", y1 - 2.5).attr("width", 5).attr("height", 5).attr("class", `${sideCls(d.side)}-stroke`).style("fill", "var(--surface)");
      g.append("line").attr("x1", x0).attr("y1", y0).attr("x2", x1).attr("y2", y1).style("stroke", "transparent").style("stroke-width", 12);
    });

    // the possession chain that ended in a shot, drawn in the shooter's colour
    // (dashed where the ball passed through an opponent's hands, e.g. a spoil)
    function showChain(s) {
      gChain.selectAll("*").remove();
      const c = s && D.chains && D.chains[String(s.i)];
      if (!c || !c.x || !c.x.length) return;
      const xs = [].concat(c.x), ys = [].concat(c.y), opp = [].concat(c.opp), lab = [].concat(c.lab);
      const P = xs.map((x, i) => ({ x: CX + (s.side === "home" ? x : -x) * S, y: CY - (s.side === "home" ? ys[i] : -ys[i]) * S, opp: opp[i], lab: lab[i] }));
      P.push({ x: fx(s), y: fy(s), opp: 0 });
      const cls = sideCls(s.side);
      for (let i = 1; i < P.length; i++) {
        if (P[i].x === P[i - 1].x && P[i].y === P[i - 1].y) continue;
        gChain.append("line").attr("class", `chain-seg ${cls}-stroke`).attr("x1", P[i - 1].x).attr("y1", P[i - 1].y).attr("x2", P[i].x).attr("y2", P[i].y)
          .style("stroke-dasharray", P[i].opp || P[i - 1].opp ? "4 3" : null);
      }
      P.slice(0, -1).forEach((p) => gChain.append("circle").attr("class", `chain-pt ${p.opp ? "" : cls + "-stroke"}`).attr("cx", p.x).attr("cy", p.y).attr("r", 3.2));
      const p0 = P[0];
      gChain.append("circle").attr("class", `chain-start ${cls}-stroke`).attr("cx", p0.x).attr("cy", p0.y).attr("r", 7);
      const left = p0.x > CX + FA * S * 0.45, below = p0.y < CY - FB * S * 0.6;
      txt(gChain, p0.x + (left ? -11 : 11), p0.y + (below ? 18 : -10), "t-chain", `${s.src}: ${p0.lab}`, left ? "end" : "start");
    }

    let pulseKey = null;
    return { fg, tg, rg, showChain, update(tau) {
      fg.attr("display", (d) => (d.t <= tau ? null : "none"));
      tg.attr("display", (d) => (d.t <= tau ? null : "none"));
      rg.attr("display", (d) => (d.t <= tau ? null : "none"));
      // pulse the latest shot for 60 s of game time while playing
      let last = null;
      for (const s of SHOTS) { if (s.t > tau) break; last = s; }
      const on = last && tau < T_END && tau - last.t < 60;
      if (on && pulseKey !== last.k) {
        pulse.attr("display", null).attr("cx", fx(last)).attr("cy", fy(last)).attr("r", rShot(last.xs) + 2)
          .attr("class", `pulse ${sideCls(last.side)}-stroke`);
        pulseKey = last.k;
      } else if (!on) { pulse.attr("display", "none"); pulseKey = null; }
    } };
  })();

  // ============================= live readout ================================
  const live = (() => {
    // compact, centred block between the ring's inner edge and the top of the oval
    const y = CY - FB * S + 50;   // inside the top of the oval
    const cT = txt(gLive, CX, y - 26, "t-ring", "", "middle");
    const hT = txt(gLive, CX - 12, y, "t-live", "", "end").style("fill", "var(--home)");
    txt(gLive, CX, y - 1, "t-small", "·", "middle");
    const aT = txt(gLive, CX + 12, y, "t-live", "", "start").style("fill", "var(--away)");
    return { update(tau) {
      const e = eventAt(tau);
      hT.text(`${H.abbr} ${pct(e.wp)}`); aT.text(`${pct(1 - e.wp)} ${A.abbr}`);
      cT.text(`WIN PROBABILITY · ${clockLab(tau)}`);
    } };
  })();

  // ============================ top-5 players ================================
  // Live stats are cumulative series [[t, cum], ...] per player; "ft" stats are
  // published match totals (shown from full time); "pre" are pre-game ratings.
  const PD = D.players;
  const top5 = (() => {
    if (!PD) return { update() {}, relayout() {}, rows: [], defs: [] };
    const g = gPanelL.append("g").attr("class", "panel");
    const X0 = 40, XV = 590, y0 = PANEL_Y;
    // per layout: bar start, row spacing and note offset (the tall layout's text is
    // larger because a phone shows the 1240-wide canvas at about a third of its size)
    const SP = { tall: { XB: 330, first: 70, step: 47, note: 27 }, wide: { XB: 250, first: 54, step: 40, note: 19 } };
    let sp = SP.tall;
    const defsBy = Object.fromEntries(PD.defs.map((d) => [d.key, d]));
    const people = cols(PD.players), info = Object.fromEntries(people.map((p) => [p.id, p]));
    const tIdx = {};
    for (const [k, ser] of Object.entries(PD.series)) {
      tIdx[k] = {};
      for (const [pid, arr] of Object.entries(ser)) tIdx[k][pid] = arr.map((r) => r[0]);
    }
    let key = defsBy[params.get("stat")] ? params.get("stat") : PD.default;
    const title = txt(g, X0, y0, "t-key", "");
    const note = txt(g, X0, y0 + 19, "t-keytxt", "");
    const empty = txt(g, X0, y0 + 70, "t-keytxt", "").style("font-style", "italic");
    const rows = d3.range(5).map((i) => {
      const r = g.append("g").attr("class", "p-row").style("cursor", "pointer");
      r.append("rect").attr("x", X0 - 6).attr("y", -24).attr("width", XV - X0 + 12).attr("height", 36).style("fill", "transparent");
      const rank = txt(r, X0, 0, "t-mono", String(i + 1));
      const chip = r.append("rect").attr("x", X0 + 22).attr("y", -17).attr("width", 5).attr("height", 22).attr("rx", 2);
      const name = txt(r, X0 + 36, 0, "t-pname", "");
      const abbr = txt(r, X0 + 36, 0, "t-mono", "");
      const bar = r.append("rect").attr("y", -14).attr("height", 16).attr("rx", 3);
      const val = txt(r, XV, 0, "t-pval", "", "end");
      return { r, rank, chip, name, abbr, bar, val, pid: null, v: null };
    });
    function valueAt(def, pid, tau) {
      if (def.kind === "pre") return PD.pre[def.key] ? PD.pre[def.key][pid] : null;
      if (def.kind === "ft") return tau >= T_END && PD.ft[def.key] ? PD.ft[def.key][pid] : null;
      const arr = PD.series[def.key] && PD.series[def.key][pid];
      let v = 0;
      if (arr) { const j = d3.bisectRight(tIdx[def.key][pid], tau) - 1; if (j >= 0) v = arr[j][1]; }
      // the engine's small match-level anchor to the real margin, spread evenly over time
      if (def.key === "np" && info[pid] && info[pid].recon) v += info[pid].recon * Math.min(tau, T_END) / T_END;
      return v;
    }
    const fmt = (def, v) => {
      const signed = def.kind === "ft" || def.key === "np" || def.key === "wpa";
      return (v < 0 ? "−" : signed && v > 0 ? "+" : "") + Math.abs(v).toFixed(def.dp) + (def.pct ? " pp" : "");
    };
    const sentence = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) + "." : "");
    function update(tau) {
      const def = defsBy[key];
      title.text(`TOP 5 · ${def.label.toUpperCase()}`);
      linkText(note, sentence(def.note) || (def.kind === "pre" ? "Rating going into the match." : "Running total, both teams."));
      const top = people.map((p) => ({ p, v: valueAt(def, p.id, tau) }))
        .filter((o) => o.v != null && Number.isFinite(o.v) && (def.kind !== "live" || Math.abs(o.v) >= 0.5 * 10 ** -def.dp))
        .sort((a, b) => b.v - a.v || a.p.name.localeCompare(b.p.name)).slice(0, 5);
      empty.text(def.kind === "ft" && tau < T_END ? "Published as a match total, so it appears at full time." : top.length ? "" : "Nothing yet.");
      const maxV = d3.max(top, (o) => Math.abs(o.v)) || 1;
      rows.forEach((row, i) => {
        const o = top[i];
        row.r.attr("display", o ? null : "none");
        row.pid = o ? o.p.id : null; row.v = o ? o.v : null;
        if (!o) return;
        row.chip.attr("class", `${sideCls(o.p.side)}-fill`);
        row.name.text(o.p.name);

        row.bar.attr("class", `${sideCls(o.p.side)}-fill`).attr("x", sp.XB).attr("width", (Math.max(0, o.v) / maxV) * (XV - 75 - sp.XB)).style("opacity", 0.85);
        row.val.text(fmt(def, o.v));
      });
    }
    function relayout(name) {
      sp = SP[name] || SP.tall;
      note.attr("y", y0 + sp.note);
      empty.attr("y", y0 + sp.first + 16);
      rows.forEach((row, i) => row.r.attr("transform", `translate(0,${y0 + sp.first + i * sp.step})`));

    return { update, relayout, rows, defs: PD.defs, defsBy, info, fmt, setKey(k) { key = k; }, get key() { return key; } };
  })();

  // ============================== xS sources ==================================
  // 100% stacked bar per team: share of its xS by how the chain behind each shot
  // began. Segment colours are the categorical slots after the two team colours.
  const sources = (() => {
    const cats = D.sources || [];
    if (!cats.length) return { update() {}, highlight() {} };
    const g = gPanelR.append("g").attr("class", "panel");
    const X0 = 660, XB = 754, BW = 1200 - XB, y0 = PANEL_Y, BH = 28;
    const catCls = (c) => `src-${cats.indexOf(c) + 1}`;
    txt(g, X0, y0, "t-key", "HOW THE xS WAS CREATED");
    const note = txt(g, X0, y0 + 19, "t-keytxt", "Share of each team’s xS by how the chain behind the shot began.");
    const gLeg = g.append("g"), gBars = [g.append("g"), g.append("g")];
    // legend
    const legend = cats.map((c) => ({
      sw: gLeg.append("rect").attr("y", y0 + 38).attr("width", 12).attr("height", 12).attr("rx", 2).attr("class", catCls(c)),
      t: txt(gLeg, 0, y0 + 49, "t-keytxt", c),
    }));
    // legend items spaced by their measured width (text size differs by layout);
    // in the tall layout the note, legend and bars sit lower to make room for larger text
    function relayout(name) {
      const tall = name !== "wide";
      note.attr("y", y0 + (tall ? 27 : 19));
      gLeg.attr("transform", `translate(0,${tall ? 12 : 0})`);
      gBars.forEach((gb, i) => gb.attr("transform", `translate(0,${tall ? 22 + i * 8 : 0})`));
      let lx = X0;
      legend.forEach(({ sw, t }) => { sw.attr("x", lx); t.attr("x", lx + 17); lx += 17 + t.node().getComputedTextLength() + 18; });
    }
    const teams = [["home", H], ["away", A]].map(([side, tm], i) => {
      const y = y0 + 78 + i * 62, gt = gBars[i];
      gt.append("rect").attr("x", X0).attr("y", y).attr("width", 5).attr("height", BH).attr("rx", 2).attr("class", `${side}-fill`);
      txt(gt, X0 + 12, y + 13, "t-abbr", tm.abbr);
      const tot = txt(gt, X0 + 12, y + 30, "t-srcval", "");
      const segs = cats.map((c) => {
        const sg = gt.append("g").attr("class", "src-seg").datum({ c, side }).style("cursor", "pointer");
        const r = sg.append("rect").attr("y", y).attr("height", BH).attr("class", catCls(c));
        const lab = txt(sg, 0, y + BH / 2 + 4.5, "t-seglab", "", "middle");
        return { c, sg, r, lab };
      });
      const empty = txt(gt, XB, y + BH / 2 + 4.5, "t-keytxt", "").style("font-style", "italic");
      return { side, segs, tot, empty };
    });
    function agg(tau) {
      const o = { home: { tot: 0, by: {} }, away: { tot: 0, by: {} } };
      for (const s of SHOTS) {
        if (s.t > tau) break;
        const b = o[s.side]; b.tot += s.xs;
        const k = b.by[s.src] || (b.by[s.src] = { xs: 0, n: 0, g: 0 });
        k.xs += s.xs; k.n++; if (s.pts === 6) k.g++;
      }
      return o;
    }
    // label ink that reads on the segment's own colour
    const inkOn = (el) => {
      const m = getComputedStyle(el).fill.match(/\d+(\.\d+)?/g);
      if (!m) return "#0b0b0b";
      const [r, gg, b] = m.slice(0, 3).map((v) => { v = +v / 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
      return 0.2126 * r + 0.7152 * gg + 0.0722 * b > 0.25 ? "#0b0b0b" : "#ffffff";
    };
    function update(tau) {
      const o = agg(tau);
      teams.forEach((tm) => {
        const b = o[tm.side];
        tm.tot.text(b.tot ? `${b.tot.toFixed(1)} xS` : "");
        tm.empty.text(b.tot ? "" : "No shots yet.");
        let x = XB;
        tm.segs.forEach((s) => {
          const v = (b.by[s.c] || { xs: 0 }).xs, w = b.tot ? (v / b.tot) * BW : 0;
          // 2px surface gap between neighbouring segments
          s.r.attr("x", x).attr("width", Math.max(0, w - 2));
          s.sg.attr("display", w > 0 ? null : "none");
          // label only where it fits (about 2.6 characters at the current font size)
          const fits = w >= 2.6 * (parseFloat(getComputedStyle(s.lab.node()).fontSize) || 12);
          s.lab.attr("x", x + (w - 2) / 2).text(fits ? `${Math.round((v / b.tot) * 100)}%` : "").style("fill", inkOn(s.r.node()));
          x += w;
        });
      });
    }
    function highlight(side, c) {
      g.classed("src-dim", !!side);
      g.selectAll(".src-seg").classed("src-hl", (d) => !!side && d.side === side && d.c === c);
    }
    g.selectAll(".src-seg")
      .on("pointerenter pointermove", (ev, d) => {
        const b = agg(state.tau)[d.side], k = b.by[d.c] || { xs: 0, n: 0, g: 0 }, tm = d.side === "home" ? H : A;
        highlight(d.side, d.c);
        shotsBy((s) => s.side === d.side && s.src === d.c);
        showTip(`${sw(d.side)}<b>${tm.abbr} · ${d.c}</b><br>${k.xs.toFixed(1)} xS from ${k.n} shot${k.n === 1 ? "" : "s"} (${k.g} goal${k.g === 1 ? "" : "s"})<br>` +
          `<span class="k">${b.tot ? Math.round((k.xs / b.tot) * 100) : 0}% of ${tm.abbr}’s ${b.tot.toFixed(1)} xS (shots highlighted)</span>`, ev);
      })
      .on("pointerleave", () => { highlight(null); shotsBy(null); hideTip(); });
    return { update, highlight, relayout };
  })();

  // ================================ footer ===================================

  // =============================== tooltip ===================================

    .on("pointerenter pointermove", (ev, d) => {

        `The model first gave the ${tm.nick} a ${pct(1 - d.p_value)} chance (lead ${d.lead}).<br>` +

  // hover the WP ring: nearest event at or before that time (and before tau)

      let a = Math.atan2((x - CX) / (rm + E), -(y - CY) / rm); if (a < 0) a += 2 * Math.PI;

        `${sw("home")}${H.abbr} <b>${pct(e.wp)}</b> · ${sw("away")}${A.abbr} <b>${pct(1 - e.wp)}</b><br><span class="k">${e.desc || ""}</span>`, ev);

    .on("pointerleave", () => { hoverLine.attr("display", "none"); hoverDot.attr("display", "none"); hideTip(); });
  // the decided marker sits above the ring's hover layer so it gets its own tooltip
  if (ring.callMark) gHover.node().appendChild(ring.callMark.node());

  // =============================== playback ==================================
  const SPEEDS = [10, 30, 60, 120];

  const $ = (id) => document.getElementById(id);

  function render(tau) {

  // ================================ export ===================================
  const VARS = ["--surface", "--ink", "--ink2", "--muted", "--grid", "--axis", "--grass", "--line", "--home", "--away", "--src-1", "--src-2", "--src-3", "--src-4", "--serif", "--sans", "--mono"];

  // ================================ layout ===================================
  const tallH = STATIC ? footer.keyBottom + 40 : PANEL_Y + 300;
  const LAYOUTS = {
    tall: { W: 1240, H: tallH, score: [0, 0], ring: [0, 0], table: [0, 0], panelL: [0, 0], panelR: [0, 0], rule2: true,
            credit: [1200, tallH - 14, "end"] },
    // 1920 x 1080: title, score, table, top 5 and xS sources in a left column (x 40-680);
    // ring on the right, centred at (1290, 540)
    wide: { W: 1920, H: 1080, score: [0, 22], ring: [670, -272], table: [-650, 222], panelL: [0, -818], panelR: [-620, -556], rule2: false,
            credit: [40, 1058, "start"] },
  };
  const tr = ([x, y]) => `translate(${x},${y})`;
  let layoutName = null;
  function applyLayout(name) {
    if (name === layoutName) return;
    layoutName = name;
    const L = LAYOUTS[name];
    W = L.W; HGT = L.H;
    svg.attr("viewBox", `0 0 ${W} ${HGT}`);
    bg.attr("width", W).attr("height", HGT);
    header.layout(name, W);
    gScore.attr("transform", tr(L.score));
    gRingBlock.attr("transform", tr(L.ring));
    gTable.attr("transform", tr(L.table));
    gPanelL.attr("transform", tr(L.panelL));
    gPanelR.attr("transform", tr(L.panelR));
    gRule2.attr("display", L.rule2 ? null : "none");
    gFoot.attr("display", STATIC && name === "tall" ? null : "none");
    footer.creditEl.attr("x", L.credit[0]).attr("y", L.credit[1]).attr("text-anchor", L.credit[2]);
    document.documentElement.classList.toggle("wide", name === "wide");
    document.documentElement.classList.toggle("tall", name === "tall");
    sources.relayout(name); top5.relayout(name);
    top5.update(state.tau); sources.update(state.tau);
    fitHeight();
  }
  // desktop: wide when the window is landscape and roomy; ?layout= overrides
  const pickLayout = () => {
    const forced = params.get("layout");
    if (forced === "wide" || forced === "tall") return forced;
    if (STATIC) return "tall";
    return innerWidth >= 1100 && innerWidth / innerHeight >= 1.15 ? "wide" : "tall";
  };
  // keep the controls on screen: the graphic gets the window height minus the controls
  function fitHeight() {
    const c = document.getElementById("controls");
    document.documentElement.style.setProperty("--ctl-h", (c && !STATIC ? c.offsetHeight + 44 : 0) + "px");
  }
  let rsz = null;
  addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { applyLayout(pickLayout()); fitHeight(); }, 120); });
  applyLayout(pickLayout());

  // ================================= init ====================================
  setSpeed(state.speed);
  const t0 = parseFloat(params.get("t"));
  render(Number.isFinite(t0) ? t0 * 60 : T_END);
  // ?shot=<display_order>: open with that shot selected (chain drawn), e.g. for sharing or export
  const pre = SHOTS.find((x) => String(x.i) === params.get("shot"));
  if (pre) { if (pre.t > state.tau) render(pre.t); highlight(pre); }
  window.matchViz = { render, play, pause, state, data: D, svgString };
})();
</script>
