- title: Greyhound Barrier Analysis
  path: https://rexcarruthers.github.io/Website/Greyhound/
  image: images/gh.png
  description: >
    Understanding how box position influences race outcomes is essential for anyone looking to gain an edge in greyhound racing.
    In this post, we break down barrier performance using clean, data-driven visuals to highlight which boxes consistently over- or under-perform.
    By examining patterns across tracks, distances, and conditions, we reveal how subtle positional advantages can compound into meaningful differences
    in win rates. Whether you’re a casual punter or a form-focused analyst, this overview will help you interpret barrier data with more confidence and
    spot opportunities others overlook.
  categories: [R, GLM, Data Cleaning]
  date: 2025-10-10

- title: Brownlow Medal Model
  path: https://rexcarruthers.github.io/Website/BLModel/
  image: images/bl.png
  description: >
    This post walks through the full workflow for building an ordinal regression model with random effects to predict the Brownlow Medal.
    Using AFL data from multiple sources, we clean and merge player-game statistics before estimating player-specific biases through a mixed model.
    These random intercepts are then incorporated into an ordinal model to generate vote probabilities for every match.
    Finally, we run Monte Carlo simulations to recreate the umpire voting process and estimate each player’s chances of winning.
    Whether you're interested in AFL analytics or statistical modelling, this tutorial provides a clear, practical guide from raw data to simulated outcomes.
  categories: [R, Machine Learning, Statistical Modelling]
  date: 2025-08-01
  
