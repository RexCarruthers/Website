- title: Habit Tracking Retro Web App
  path: https://retro-tracker-one.vercel.app/
  image: images/ht.png
  description: >
    A fitness and habit tracking PWA built with React, TypeScript, and Supabase.
    Inspired by the "cassette futurism" aesthetic of Alien and Blade Runner, it features an authentic CRT terminal interface with amber phosphor glow effects and scanlines.
    CSS and aesthtic taken from this repo https://github.com/Imetomi/retro-futuristic-ui-design.
    The offline-first architecture uses localStorage for instant responsiveness, syncing seamlessly to the cloud when online.
    Can be installed as a native app on any device—no app store required.
  categories: [CSS, Typescript, React, SQL]
  date: 2026-01-01