- title: AFL Season 2026 - Simulation App
  path: https://rexapps.shinyapps.io/AFLSim2026/
  image: images/as.png
  description: >
    XGBoost model of the 2026 regular home and away season with GenElo, Team Attack/Defence Rating, Player Rating (Individual player 10gma) and Travel distance as inputs.
    Static input Monte Carlo simulation for the season with prediction uncertainty increasing with time to the game. Team ability inputs and uncertainty is user adjustable.
    Fixture difficulty by Elo and travel difference included.
  categories: [R, Machine Learning, Statistical Modelling, Shiny, Monte Carlo]
  date: 2026-01-31

- title: Brownlow Medal Model
  path: https://rexcarruthers.github.io/Website/BLModel/
  image: images/bl.png
  description: >
    This post walks through the full workflow for building an ordinal regression model with random effects to predict the Brownlow Medal.
    Using AFL data from fitzRoy R package, player-game are used to estimate player-specific biases through a mixed model.
    These random intercepts are then incorporated into an ordinal model to generate vote probabilities for every match.
    Monte Carlo simulations are used to recreate the umpire voting process and estimate each player’s chances of winning.
  categories: [R, Machine Learning, Statistical Modelling]
  date: 2025-08-01
  
