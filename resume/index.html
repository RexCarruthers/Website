(function render() {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const has = a => Array.isArray(a) && a.length > 0;
  const fixUrl = u => /^(https?:|mailto:)/i.test(u) ? u : "https://" + u;
  const telHref = p => "tel:" + p.replace(/[^\d+]/g, "");
  const money = v => { const n = parseFloat(String(v).replace(/[^\d.]/g, "")); return isNaN(n) ? 0 : n; };
  const fmtM = n => "$" + (Math.round(n * 10) / 10).toString() + "M";
  const icon = {
    pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    phone: '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
    mail: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    link: '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
  };
  const R = RESUME, B = R.basics, pub = SETTINGS.publicMode;

  const contact = [
    B.location && `<li>${icon.pin}${esc(B.location)}</li>`,
    B.email && `<li>${icon.mail}<a href="mailto:${esc(B.email)}">${esc(B.email)}</a></li>`,
    !pub && B.phone && `<li>${icon.phone}<a href="${telHref(B.phone)}">${esc(B.phone)}</a></li>`,
    ...(B.links || []).filter(l => l.url).map(l => `<li>${icon.link}<a href="${esc(fixUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`)
  ].filter(Boolean).join("");

  const projectList = ps => {
    const total = ps.reduce((s, p) => s + money(p.value), 0);
    return `<details class="projects"${SETTINGS.projectsOpen ? " open" : ""}>
      <summary>${ps.length} major project${ps.length > 1 ? "s" : ""}${total ? ` · <span class="mono">${fmtM(total)}</span> combined` : ""}</summary>
      <div class="proj-list">${ps.map(p => `
        <div class="proj"><span class="proj-name">${esc(p.name)}</span><span class="proj-value">${esc(p.value)}</span>${p.client ? `<span class="proj-client">${esc(p.client)}</span>` : ""}</div>`).join("")}
      </div></details>`;
  };

  const experience = (R.experience || []).map(e => `
    <div class="entry">
      <p class="org">${esc(e.company)}${e.location ? ` <span class="loc">· ${esc(e.location)}</span>` : ""}</p>
      ${(e.roles || []).map(r => `
        <div class="role"><span class="role-title">${esc(r.title)}</span><span class="mono">${esc(r.dates)}</span></div>
        ${r.project ? `<div class="role-project">${esc(r.project)}</div>` : ""}`).join("")}
      ${has(e.bullets) ? `<ul class="bullets">${e.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
      ${has(e.projects) ? projectList(e.projects) : ""}
    </div>`).join("");

  const education = (R.education || []).map(e => `
    <div class="edu">
      <div class="edu-top"><span class="edu-degree">${esc(e.degree)}</span><span class="mono">${esc(e.dates)}</span></div>
      <div class="edu-inst">${esc(e.institution)}</div>
      ${(e.notes || []).map(n => `<div class="edu-note">${esc(n)}</div>`).join("")}
      ${e.status ? `<span class="badge">${esc(e.status)}</span>` : ""}
    </div>`).join("");

  const portfolio = (R.portfolio || []).map(p => `
    <div class="portfolio-item">
      <div class="t">${p.url ? `<a href="${esc(fixUrl(p.url))}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</div>
      ${p.subtitle ? `<div class="mono">${esc(p.subtitle)}</div>` : ""}
      ${p.description ? `<p>${esc(p.description)}</p>` : ""}
    </div>`).join("");

  const skills = (R.skills || []).filter(g => has(g.items)).map(g => `
    <div class="skill-group"><h3>${esc(g.group)}</h3>
      <ul class="tags${g.accent ? " accent" : ""}">${g.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    </div>`).join("");

  const licences = (R.licences || []).map(l => `<li>${esc(l.name)}${l.code ? `<span class="mono">${esc(l.code)}</span>` : ""}</li>`).join("");

  const references = (R.references || []).map(r => `
    <div class="ref">
      <div class="ref-name">${esc(r.name)}</div>
      <div class="ref-role">${esc(r.role)}${r.company ? `<br><span class="ref-co">${esc(r.company)}</span>` : ""}</div>
      ${pub
        ? `<div class="ref-onrequest">Contact details available on request</div>`
        : `<div class="ref-contact">
            ${r.phone ? `<a href="${telHref(r.phone)}">${esc(r.phone)}</a>` : ""}
            ${r.email ? `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : ""}
          </div>`}
    </div>`).join("");

  const sec = (id, title, body) => body ? `<section class="s-${id}" id="${id}"><h2>${title}</h2>${body}</section>` : "";

  document.getElementById("resume").innerHTML = `
    <header>
      <h1>${esc(B.name)}</h1>
      ${B.headline ? `<p class="headline">${esc(B.headline)}</p>` : ""}
      <ul class="contact">${contact}</ul>
    </header>
    ${R.summary ? `<section id="profile"><h2>Profile</h2><p class="summary">${esc(R.summary)}</p></section>` : ""}
    <div class="cols">
      <div class="main">
        ${sec("education", "Education", education)}
        ${sec("portfolio", "Projects", portfolio)}
        ${sec("experience", "Experience", experience && `<div class="timeline">${experience}</div>`)}
      </div>
      <aside>
        ${sec("skills", "Skills", skills)}
        ${sec("references", "References", references && `<div class="refs">${references}</div>`)}
        ${sec("licences", "Licences", licences && `<ul class="creds">${licences}</ul>`)}
      </aside>
    </div>
    ${SETTINGS.lastUpdated ? `<footer>Updated ${esc(SETTINGS.lastUpdated)}</footer>` : ""}
  `;

  // Phone jump-links (follows the phone section order)
  const jumpOrder = [["skills", "Skills"], ["education", "Education"], ["portfolio", "Projects"], ["experience", "Experience"], ["references", "References"]];
  document.getElementById("jump").innerHTML = jumpOrder
    .filter(([id]) => document.getElementById(id))
    .map(([id, label]) => `<a href="#${id}">${label}</a>`).join("");

})();

/* Light / dark toggle — remembers the choice on this device */
(function themeToggle() {
  const root = document.documentElement, btn = document.getElementById("themeBtn");
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const moon = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const sun = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const current = () => root.dataset.theme || (mq.matches ? "dark" : "light");
  const paint = () => {
    const dark = current() === "dark";
    btn.innerHTML = (dark ? sun : moon) + `<span class="label">${dark ? "Light" : "Dark"}</span>`;
    btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  };
  btn.addEventListener("click", () => {
    const next = current() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("resume-theme", next); } catch (e) {}
    paint();
  });
  mq.addEventListener && mq.addEventListener("change", paint);
  paint();
})();
</script>
