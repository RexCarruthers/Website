<style>
  #title-block-header.minigolf-header {
    position: relative;
    overflow: hidden;
    background: #2b7336;
    user-select: none;
    -webkit-user-select: none;
  }

  #minigolf {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: pan-y pinch-zoom;
  }

  /* Logo and titles are painted onto the green like a stencil. No z-index
     here, so the blend modes mix with the canvas underneath. */
  .minigolf-header .title-block-content {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 130px 16px;
    pointer-events: none;
  }

  .minigolf-header .stencil-logo {
    width: 300px;
    max-width: 100%;
    height: auto;
    margin-bottom: 20px;
    filter: invert(1);
    mix-blend-mode: screen;
    opacity: 0.42;
  }

  .minigolf-header .title-block-content h1,
  .minigolf-header .title-block-content p {
    color: rgba(255, 255, 255, 0.5) !important;
    mix-blend-mode: soft-light;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0.15em 0;
  }
  .minigolf-header .title-block-content h1 {
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 3.4rem);
    color: rgba(255, 255, 255, 0.62) !important;
    mix-blend-mode: normal;
    opacity: 0.75;
  }
  .minigolf-header .title-block-content p {
    mix-blend-mode: normal;
    opacity: 0.7;
  }

  .minigolf-hud {
    position: absolute;
    top: 10px;
    left: 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
    max-width: calc(100% - 20px);
    padding: 6px 8px 6px 12px;
    border-radius: 8px;
    background: rgba(10, 30, 14, 0.55);
    color: #fff;
    font: 600 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .minigolf-hud .label {
    opacity: 0.7;
    font-weight: 500;
    margin-right: 3px;
  }
  .minigolf-hud button {
    font: inherit;
    color: #fff;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 6px;
    padding: 2px 10px;
    cursor: pointer;
  }
  .minigolf-hud button:hover,
  .minigolf-hud button:focus-visible {
    background: rgba(255, 255, 255, 0.28);
  }
  .minigolf-hud .msg {
    flex-basis: 100%;
    color: #ffe98a;
  }
</style>

<header id="title-block-header" class="minigolf-header">
  <canvas
    id="minigolf"
    role="img"
    aria-label="Mini golf putting green: drag back from the ball to putt"
  ></canvas>

  <div class="minigolf-hud" aria-live="polite">
    <span><span class="label">Hole</span><span id="mg-hole">1/5</span></span>
    <span><span class="label">Strokes</span><span id="mg-strokes">0</span></span>
    <span><span class="label">Best</span><span id="mg-best">–</span></span>
    <button type="button" id="mg-reset">New game</button>
    <span class="msg" id="mg-msg" hidden></span>
  </div>

  <div class="title-block-content">
    <img class="stencil-logo" src="./logo.png" alt="Acatalepsy logo" />
    $if(title)$
    <h1 class="title">$title$</h1>
    $endif$ $if(subtitle)$
    <p class="subtitle">$subtitle$</p>
    $endif$ $for(author)$
    <p class="author">$author$</p>
    $endfor$ $if(date)$
    <p class="date">$date$</p>
    $endif$ $if(abstract)$
    <div class="abstract">
      <div class="abstract-title">$abstract-title$</div>
      $abstract$
    </div>
    $endif$
  </div>

  <script src="./minigolf.js"></script>
</header>
